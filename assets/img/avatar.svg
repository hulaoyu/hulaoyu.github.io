<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 208" width="208" height="208" role="img" aria-label="胡天宇的头像">
  <defs>
    <clipPath id="c"><circle cx="104" cy="104" r="104"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1e4"/>
      <stop offset="1" stop-color="#eae2d0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="208" height="208" fill="url(#g)"/>

    <!-- 决策边界：两道弯 -->
    <path d="M-8 146 C 34 146, 44 92, 74 92 S 116 136, 146 136 S 186 96, 216 96"
          fill="none" stroke="#b23a24" stroke-width="1.4" opacity=".34"/>
    <path d="M-8 158 C 34 158, 48 112, 78 112 S 118 150, 148 150 S 188 114, 216 114"
          fill="none" stroke="#245a51" stroke-width="1" opacity=".28" stroke-dasharray="4 5"/>

    <!-- 六个隐藏单元 -->
    <g fill="#1d1c19" opacity=".55">
      <circle cx="42" cy="72" r="2.2"/>
      <circle cx="44" cy="94" r="2.2"/>
      <circle cx="40" cy="116" r="2.2"/>
      <circle cx="168" cy="72" r="2.2"/>
      <circle cx="166" cy="94" r="2.2"/>
      <circle cx="170" cy="116" r="2.2"/>
    </g>

    <text x="104" y="128" text-anchor="middle" fill="#1d1c19"
          font-family="Songti SC, SimSun, Noto Serif CJK SC, Georgia, serif"
          font-size="88" font-weight="500" letter-spacing="2">胡</text>

    <circle cx="152" cy="150" r="4.5" fill="#b23a24"/>
  </g>
</svg>
